name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # Detector/parser tests need only pydantic and pytest; the API tests import
      # api/* at collection time, so the public-API pins (fastapi, psycopg[binary],
      # requests — all wheels, no system libraries) come along, plus httpx for
      # fastapi.testclient. The heavier requirements.txt pins (confluent-kafka)
      # stay out: they are exercised by the deployed stack, not by these tests.
      - name: Install test dependencies
        run: pip install -r requirements-api.txt httpx==0.28.1 pydantic==2.9.2 pytest==8.3.3
      - name: Run tests
        run: python3 -m pytest tests/ -q

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # Pinned because the ignore list in pyproject.toml was validated against this
      # ruff version; an unpinned linter can start failing on newly added rules.
      - name: Install ruff
        run: pip install ruff==0.16.2
      - name: Lint
        run: ruff check .

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install
        run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
      # Build proves the page compiles and prerenders; the Playwright smoke is
      # local-only (needs a browser + a running server — spec §5).
      - name: Build
        run: npm run build

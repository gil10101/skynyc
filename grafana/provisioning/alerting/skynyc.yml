# Alerting provisioned like everything else (Manual 08). One rule, on the one
# signal that summarizes the whole live path: seconds since the newest
# live_states row. If it exceeds five minutes for five minutes, a push
# notification goes out via ntfy — the freshness stat stops being a number
# someone has to be looking at.
apiVersion: 1

contactPoints:
  - orgId: 1
    name: ops-push
    receivers:
      - uid: skynyc-ntfy
        type: webhook
        settings:
          url: https://ntfy.sh/$NTFY_TOPIC
          httpMethod: POST

policies:
  - orgId: 1
    receiver: ops-push
    group_by: ["alertname"]

groups:
  - orgId: 1
    name: skynyc-liveness
    folder: SkyNYC
    interval: 1m
    rules:
      - uid: skynyc-freshness
        title: Live pipeline stale
        condition: C
        for: 5m
        noDataState: Alerting
        execErrState: Alerting
        annotations:
          summary: live_states has not been updated in over five minutes — a producer or the stream is down
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: skynyc-pg
            model:
              refId: A
              format: table
              rawSql: SELECT extract(epoch from now() - max(updated_at)) AS staleness_s FROM live_states
          - refId: C
            relativeTimeRange: { from: 0, to: 0 }
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [300]

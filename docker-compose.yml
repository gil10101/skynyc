# SkyNYC — the full stack: infrastructure (kafka, postgres, grafana), ingestion
# (producer-opensky, producer-weather, consumer-weather), processing (spark),
# and batch orchestration (dagster-webserver, dagster-daemon) per PRD §11.
# All long-running services use restart: unless-stopped — Docker supervises the
# streams, Dagster supervises batch (Manual 02).

name: skynyc

services:
  kafka:
    image: apache/kafka:4.3.1
    container_name: skynyc-kafka
    restart: unless-stopped
    ports:
      # Loopback-bound: Docker's iptables rules bypass ufw, so a bare "9092:9092"
      # is internet-exposed on a public host regardless of firewall. Host tools
      # use localhost; remote access is an SSH tunnel (guide 3 §A4).
      - "127.0.0.1:9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      # Fixed cluster id so the formatted kafkadata volume stays valid across recreates.
      CLUSTER_ID: 5L6g3nShT-eMCtK--X86sw
      KAFKA_LISTENERS: PLAINTEXT://:19092,CONTROLLER://:9093,PLAINTEXT_HOST://:9092
      # In-compose clients use kafka:19092; host tools use localhost:9092.
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:19092,PLAINTEXT_HOST://localhost:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # Must match the volume mount, or the log dir silently lives in the container fs.
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      TZ: UTC
    volumes:
      - kafkadata:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  postgres:
    image: postgres:16
    container_name: skynyc-postgres
    restart: unless-stopped
    ports:
      # Loopback-bound — see the note on the kafka service.
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-skynyc}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-skynyc}
      POSTGRES_DB: ${POSTGRES_DB:-skynyc}
      TZ: UTC
      PGTZ: UTC
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Runs ONLY on an empty volume — see the trap in db/init/001_schema.sql (Manual 05).
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-skynyc} -d ${POSTGRES_DB:-skynyc}"]
      interval: 10s
      timeout: 5s
      retries: 10

  producer-opensky:
    build: .
    image: skynyc-ingest
    container_name: skynyc-producer-opensky
    restart: unless-stopped
    command: python -m producers.opensky_producer
    env_file: .env
    environment:
      # In-compose clients use the internal listener, not localhost (Manual 03).
      KAFKA_BOOTSTRAP: kafka:19092
      TZ: UTC
    depends_on:
      kafka:
        condition: service_healthy

  producer-weather:
    build: .
    image: skynyc-ingest
    container_name: skynyc-producer-weather
    restart: unless-stopped
    command: python -m producers.weather_producer
    env_file: .env
    environment:
      KAFKA_BOOTSTRAP: kafka:19092
      TZ: UTC
    depends_on:
      kafka:
        condition: service_healthy

  consumer-weather:
    build: .
    image: skynyc-ingest
    container_name: skynyc-consumer-weather
    restart: unless-stopped
    command: python -m consumers.weather_to_pg
    env_file: .env
    environment:
      KAFKA_BOOTSTRAP: kafka:19092
      # Overrides the host-oriented PG_DSN from .env: inside compose the
      # database's hostname is the service name.
      PG_DSN: postgresql://${POSTGRES_USER:-skynyc}:${POSTGRES_PASSWORD:-skynyc}@postgres:5432/${POSTGRES_DB:-skynyc}
      TZ: UTC
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy

  spark:
    build:
      context: .
      dockerfile: Dockerfile.spark
    image: skynyc-spark
    container_name: skynyc-spark
    restart: unless-stopped
    env_file: .env
    environment:
      KAFKA_BOOTSTRAP: kafka:19092
      PG_DSN: postgresql://${POSTGRES_USER:-skynyc}:${POSTGRES_PASSWORD:-skynyc}@postgres:5432/${POSTGRES_DB:-skynyc}
      TZ: UTC
    ports:
      # Spark UI, loopback-bound like everything else; tunnel to view remotely.
      - "127.0.0.1:4040:4040"
    volumes:
      # Checkpoints are the queries' Kafka positions (Manual 04) — bind-mounted
      # so `docker compose down` never destroys offsets.
      - ./checkpoints:/app/checkpoints
      # Local bronze fallback when AZURE_STORAGE_* is unset.
      - ./data:/app/data
      # Ivy cache: --packages jars download once, survive restarts.
      - ivy-cache:/opt/ivy
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy

  dagster-webserver:
    build:
      context: .
      dockerfile: Dockerfile.dagster
    image: skynyc-dagster
    container_name: skynyc-dagster-webserver
    restart: unless-stopped
    command: dagster-webserver -h 0.0.0.0 -p 3001 -w workspace.yaml
    env_file: .env
    environment:
      PG_HOST: postgres
      PG_DSN: postgresql://${POSTGRES_USER:-skynyc}:${POSTGRES_PASSWORD:-skynyc}@postgres:5432/${POSTGRES_DB:-skynyc}
      TZ: UTC
    ports:
      - "127.0.0.1:3001:3001"
    depends_on:
      postgres:
        condition: service_healthy

  # Schedules only tick while the daemon runs — a stopped daemon fails silently
  # from the UI's point of view (Manual 07).
  dagster-daemon:
    image: skynyc-dagster
    container_name: skynyc-dagster-daemon
    restart: unless-stopped
    command: dagster-daemon run -w workspace.yaml
    env_file: .env
    environment:
      PG_HOST: postgres
      PG_DSN: postgresql://${POSTGRES_USER:-skynyc}:${POSTGRES_PASSWORD:-skynyc}@postgres:5432/${POSTGRES_DB:-skynyc}
      TZ: UTC
    depends_on:
      postgres:
        condition: service_healthy
      dagster-webserver:
        condition: service_started

  grafana:
    image: grafana/grafana-oss:11.6.1
    container_name: skynyc-grafana
    restart: unless-stopped
    ports:
      # Loopback-bound — see the note on the kafka service.
      - "127.0.0.1:3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_DEFAULT_THEME: dark
      # Read by the provisioned datasource yaml ($POSTGRES_PASSWORD interpolation).
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-skynyc}
      # Read by the provisioned alerting yaml ($NTFY_TOPIC interpolation).
      NTFY_TOPIC: ${NTFY_TOPIC:-skynyc-unconfigured}
      TZ: UTC
    volumes:
      - grafana-data:/var/lib/grafana
      # Datasource + dashboard JSON land here in M2 (Manual 08). Repo is the source of truth.
      - ./grafana/provisioning:/etc/grafana/provisioning
    depends_on:
      postgres:
        condition: service_healthy

  # Public read-only API for sky.gillu.me (public-dashboard spec §3.2).
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    image: skynyc-api
    container_name: skynyc-api
    restart: unless-stopped
    env_file: .env
    environment:
      PG_RO_DSN: postgresql://skynyc_ro:${PG_RO_PASSWORD:-changeme}@postgres:5432/${POSTGRES_DB:-skynyc}
      TZ: UTC
    depends_on:
      postgres:
        condition: service_healthy

  # Public TLS ingress for the API ONLY — the one deliberate exception to the
  # loopback-bind rule (public-dashboard spec §3.3): the sky.gillu.me frontend
  # must reach api.sky.gillu.me from browsers. Everything else stays 127.0.0.1.
  caddy:
    image: caddy:2.9
    container_name: skynyc-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    depends_on:
      - api

volumes:
  kafkadata:
  pgdata:
  grafana-data:
  ivy-cache:
  caddy-data:

# SkyNYC dbt project (PRD §9): staging views over the raw tables, the
# hour spine + weather join-at-read intermediates, and the marts that answer
# the business question and score the detectors.
name: skynyc_dbt
version: "1.0.0"
profile: skynyc_dbt

model-paths: ["models"]
test-paths: ["tests"]

models:
  skynyc_dbt:
    staging:
      +materialized: view
    intermediate:
      +materialized: view
    marts:
      +materialized: table

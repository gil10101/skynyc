version: 2

models:
  - name: mart_detection_quality
    description: >
      One row per UTC day per airport: detected vs ground-truth arrival counts
      and the resulting precision/recall (PRD §9; targets P >= 0.85, R >= 0.80).
      The published quality score for the detection pipeline.
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [quality_date, airport]
    columns:
      - name: quality_date
        tests: [not_null]
      - name: airport
        tests:
          - not_null
          - accepted_values:
              values: ["KJFK", "KLGA", "KEWR"]
      - name: arrivals_detected
        tests: [not_null]
      - name: arrivals_gt
        tests: [not_null]

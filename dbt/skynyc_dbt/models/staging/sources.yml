version: 2

sources:
  - name: skynyc
    database: "{{ env_var('POSTGRES_DB', 'skynyc') }}"
    schema: public
    tables:
      - name: flight_events
        description: Detected operational events from the Q3 stream (PRD §7).
        loaded_at_field: detected_at
        freshness:
          # Freshness IS the monitoring story: events stale means Spark or a
          # producer is down — fix upstream, re-running dbt cannot help.
          warn_after: { count: 1, period: hour }
          error_after: { count: 3, period: hour }
      - name: arrivals_ground_truth
        description: OpenSky nightly-batch arrivals (D-1 freshest, PRD §5.1).
        loaded_at_field: last_seen
        freshness:
          # Upstream is a nightly batch serving D-1, so anything older than two
          # days means the daily pull stopped — the daemon or its schedule is
          # off (Manual 07).
          warn_after: { count: 2, period: day }
          error_after: { count: 4, period: day }
      - name: weather_obs
        description: METAR observations, unit-converted at ingest (PRD §5.2).
        loaded_at_field: obs_ts
        freshness:
          # Reports are roughly hourly, so two hours of silence means the
          # weather producer or its consumer is down (PRD §9 threshold).
          warn_after: { count: 2, period: hour }
          error_after: { count: 6, period: hour }
      - name: weather_alerts
        description: >
          NWS alerts fanned out per airport. No freshness check: a long stretch
          with no active alert is normal weather, not a dead producer.

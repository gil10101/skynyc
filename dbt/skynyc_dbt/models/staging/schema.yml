version: 2

models:
  - name: stg_flight_events
    description: One row per detected event (grain = event_id).
    tests:
      # '' passes not_null — guards the empty-string-icao24 producer incident class.
      - dbt_utils.expression_is_true:
          expression: "icao24 <> ''"
    columns:
      - name: event_id
        tests: [unique, not_null]
      - name: icao24
        tests: [not_null]
      - name: duration_s
        tests:
          # Detector contract: a holding event without a duration silently
          # undercounts holding_minutes downstream — fail here, at the source.
          - not_null:
              config:
                where: "event_type = 'holding'"
      - name: event_type
        tests:
          - accepted_values:
              values: ["arrival", "holding", "go_around"]
      - name: airport
        tests:
          - accepted_values:
              values: ["KJFK", "KLGA", "KEWR"]
  - name: stg_arrivals_gt
    description: One row per ground-truth arrival (grain = icao24 × airport × est_arrival_ts).
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [icao24, airport, est_arrival_ts]
  - name: stg_weather_obs
    description: One row per station per observation timestamp (grain = station × obs_ts).
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [station, obs_ts]
    columns:
      - name: station
        tests:
          - not_null
          - accepted_values:
              values: ["KJFK", "KLGA", "KEWR"]
      - name: obs_ts
        tests: [not_null]
      - name: flight_category
        tests:
          - accepted_values:
              values: ["VFR", "MVFR", "IFR", "LIFR"]
  - name: stg_weather_alerts
    description: One row per alert per covered airport (grain = alert_id × airport).
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [alert_id, airport]
    columns:
      - name: alert_id
        tests: [not_null]
      - name: airport
        tests:
          - not_null
          - accepted_values:
              values: ["KJFK", "KLGA", "KEWR"]
